[project]
name = "hackmeta-26-backend"
version = "0.1.0"
description = "FastAPI backend for hackmeta-26"
authors = [
    { name = "anishalle", email = "anish.alle11@gmail.com" }
]
requires-python = ">=3.12.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx[http2]>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.33",
    "sentry-sdk>=2.69.1",
    "sqlmodel>=0.0.49",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint.per-file-ignores]
# HTML and CSS templates read better unwrapped.
"app/api/invite_page.py" = ["E501"]
