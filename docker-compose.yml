# Web + backend on the same server (NGINX terminates TLS in front of it).
#
#   backend/.env   DATABASE_URL and friends (see backend/.env.example)
#   .env           BACKEND_PORT, PUBLIC_BASE_URL and APNS_* for this host
#   secrets/       AuthKey_XXXX.p8 for Apple push (gitignored, mounted read-only)
#
#   docker compose up -d --build
#   docker compose exec backend python -m app.seed.seed   # wipes and reseeds!
#
# Local Postgres (`db`): same box as the backend, so a query costs ~1 ms instead of a
# cross-country round trip. Only reachable on the compose network (no host port). To use it,
# set in backend/.env:
#   DATABASE_URL=postgresql://hackmeta:<POSTGRES_PASSWORD>@db:5432/hackmeta
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackmeta
      POSTGRES_DB: hackmeta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackmeta -d hackmeta"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      FASTAPI_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/data
      - ./secrets:/run/secrets:ro

volumes:
  backend-data:
  db-data:
