$kind: http-request
name: 'Unknown identity is 401'
method: GET
url: '{{base_url}}/api/v1/me'
order: 3000
headers:
  - key: X-User-Id
    value: '{{nobody}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 401', () => pm.response.to.have.status(401));
