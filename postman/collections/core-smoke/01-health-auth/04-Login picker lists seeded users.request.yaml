$kind: http-request
name: 'Login picker lists seeded users'
method: GET
url: '{{base_url}}/api/v1/auth/users'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('lists the demo cast', () => {
        const ids = pm.response.json().map(u => u.id);
        ['anish', 'tony', 'maya', 'priya', 'mom'].forEach(k =>
          pm.expect(ids).to.include(pm.environment.get(k)));
      });
