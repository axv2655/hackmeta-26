$kind: http-request
name: 'Current user has no coordinates'
method: GET
url: '{{base_url}}/api/v1/me'
order: 5000
headers:
  - key: X-User-Id
    value: '{{anish}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('user schema has no location fields', () => {
        const body = pm.response.json();
        ['lat', 'lng', 'last_area', 'latitude', 'longitude'].forEach(k =>
          pm.expect(body.user).to.not.have.property(k));
        pm.expect(body.settings).to.have.property('location_opt_in');
      });
