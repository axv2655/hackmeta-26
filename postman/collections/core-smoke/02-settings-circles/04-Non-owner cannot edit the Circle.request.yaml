$kind: http-request
name: 'Non-owner cannot edit the Circle'
method: PATCH
url: '{{base_url}}/api/v1/circles/{{circle_id}}'
order: 4000
headers:
  - key: X-User-Id
    value: '{{tony}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"name": "Hijack"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 403', () => pm.response.to.have.status(403));
