$kind: http-request
name: 'Audience preview resolves Circle members'
method: POST
url: '{{base_url}}/api/v1/audience/preview'
order: 5000
headers:
  - key: X-User-Id
    value: '{{anish}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"circle_ids": ["{{circle_id}}"]}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('count matches the Circle', () => pm.expect(pm.response.json().count).to.eql(3));
