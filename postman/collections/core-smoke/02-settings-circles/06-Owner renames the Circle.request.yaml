$kind: http-request
name: 'Owner renames the Circle'
method: PATCH
url: '{{base_url}}/api/v1/circles/{{circle_id}}'
order: 6000
headers:
  - key: X-User-Id
    value: '{{anish}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"name": "Crew 2"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('renamed, members kept', () => {
        const c = pm.response.json();
        pm.expect(c.name).to.eql('Crew 2');
        pm.expect(c.members.length).to.eql(3);
      });
