$kind: http-request
name: 'Save a Mark'
method: POST
url: '{{base_url}}/api/v1/marks/{{kumo_mark}}/save'
order: 2000
headers:
  - key: X-User-Id
    value: '{{maya}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 204', () => pm.response.to.have.status(204));
