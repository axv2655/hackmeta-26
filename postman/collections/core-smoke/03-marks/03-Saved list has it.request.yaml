$kind: http-request
name: 'Saved list has it'
method: GET
url: '{{base_url}}/api/v1/me/saved'
order: 3000
headers:
  - key: X-User-Id
    value: '{{maya}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('Kumo is saved', () => pm.expect(JSON.stringify(pm.response.json())).to.include(pm.environment.get('kumo_mark')));
