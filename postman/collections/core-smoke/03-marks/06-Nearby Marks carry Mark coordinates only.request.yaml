$kind: http-request
name: 'Nearby Marks carry Mark coordinates only'
method: GET
url: '{{base_url}}/api/v1/marks/nearby?lat=32.9857&lng=-96.7502'
order: 6000
headers:
  - key: X-User-Id
    value: '{{anish}}'
queryParams:
  - key: lat
    value: '32.9857'
  - key: lng
    value: '-96.7502'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('only Mark objects carry lat/lng', () => {
        const walk = (v, path) => {
          if (Array.isArray(v)) return v.forEach((x, i) => walk(x, path));
          if (v && typeof v === 'object') {
            const isMark = 'category' in v && 'address' in v && 'name' in v;
            if (!isMark) { ['lat','lng','last_area'].forEach(k => pm.expect(v, path).to.not.have.property(k)); }
            Object.entries(v).forEach(([k, x]) => walk(x, path + '.' + k));
          }
        };
        walk(pm.response.json(), '$');
      });
