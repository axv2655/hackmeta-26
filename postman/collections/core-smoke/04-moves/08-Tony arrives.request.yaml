$kind: http-request
name: 'Tony arrives'
method: POST
url: '{{base_url}}/api/v1/moves/{{move_id}}/arrive'
order: 8000
headers:
  - key: X-User-Id
    value: '{{tony}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('tony there', () => pm.expect(pm.response.json().participants.find(p => p.user.id === pm.environment.get('tony')).status).to.eql('there'));
