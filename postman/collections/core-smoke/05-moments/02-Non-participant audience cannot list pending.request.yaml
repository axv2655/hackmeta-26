$kind: http-request
name: 'Non-participant audience cannot list pending'
method: GET
url: '{{base_url}}/api/v1/moves/{{move_id}}/moments'
order: 2000
headers:
  - key: X-User-Id
    value: '{{priya}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('pending Moment is hidden', () => pm.expect(pm.response.json()).to.eql([]));
