$kind: http-request
name: 'Author can fetch pending media'
method: GET
url: '{{base_url}}/media/{{media_file}}'
order: 6000
headers:
  - key: X-User-Id
    value: '{{anish}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('private, never cached', () => pm.expect(pm.response.headers.get('Cache-Control')).to.eql('private, no-store'));
      pm.test('is an image', () => pm.expect(pm.response.headers.get('Content-Type')).to.eql('image/png'));
