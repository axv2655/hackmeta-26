$kind: http-request
name: 'Still hidden after one approval'
method: GET
url: '{{base_url}}/media/{{media_file}}'
order: 10000
headers:
  - key: X-User-Id
    value: '{{priya}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
