$kind: http-request
name: 'Second tag approves'
method: POST
url: '{{base_url}}/api/v1/moments/{{moment_id}}/approve'
order: 11000
headers:
  - key: X-User-Id
    value: '{{dev}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"approve": true}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('approved', () => pm.expect(pm.response.json().status).to.eql('approved'));
