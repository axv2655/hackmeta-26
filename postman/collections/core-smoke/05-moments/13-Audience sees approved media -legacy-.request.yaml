$kind: http-request
name: 'Audience sees approved media (legacy)'
method: GET
url: '{{base_url}}/api/v1/media/{{media_file}}'
order: 13000
headers:
  - key: X-User-Id
    value: '{{priya}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
