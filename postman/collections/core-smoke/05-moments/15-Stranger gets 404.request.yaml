$kind: http-request
name: 'Stranger gets 404'
method: GET
url: '{{base_url}}/media/{{media_file}}'
order: 15000
headers:
  - key: X-User-Id
    value: '{{jordan}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404));
