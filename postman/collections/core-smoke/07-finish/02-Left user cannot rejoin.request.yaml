$kind: http-request
name: 'Left user cannot rejoin'
method: POST
url: '{{base_url}}/api/v1/moves/{{move_id}}/join'
order: 2000
headers:
  - key: X-User-Id
    value: '{{dev}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 409', () => pm.response.to.have.status(409));
