$kind: http-request
name: 'Creator ends the Move'
method: POST
url: '{{base_url}}/api/v1/moves/{{move_id}}/end'
order: 4000
headers:
  - key: X-User-Id
    value: '{{anish}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('ended', () => pm.expect(pm.response.json().status).to.eql('ended'));
