$kind: http-request
name: 'Ended Move cannot be joined'
method: POST
url: '{{base_url}}/api/v1/moves/{{move_id}}/join'
order: 5000
headers:
  - key: X-User-Id
    value: '{{priya}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 409', () => pm.response.to.have.status(409));
