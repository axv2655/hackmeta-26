$kind: http-request
name: 'Everyone-left: create a solo Move'
method: POST
url: '{{base_url}}/api/v1/moves'
order: 9000
headers:
  - key: X-User-Id
    value: '{{anish}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"mark_id": "{{kumo_mark}}", "text": "probe: solo", "category": "coffee", "circle_ids": ["{{circle_id}}"]}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('solo_move_id', pm.response.json().id);
