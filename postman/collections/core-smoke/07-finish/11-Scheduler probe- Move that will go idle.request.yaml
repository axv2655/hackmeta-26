$kind: http-request
name: 'Scheduler probe: Move that will go idle'
method: POST
url: '{{base_url}}/api/v1/moves'
order: 11000
headers:
  - key: X-User-Id
    value: '{{anish}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {"mark_id": "{{kumo_mark}}", "text": "probe: idle", "category": "coffee", "circle_ids": ["{{circle_id}}"]}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
