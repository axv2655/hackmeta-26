$kind: http-request
name: 'Scheduler probe: joiner'
method: POST
url: '{{base_url}}/api/v1/moves/{{active_move_id}}/join'
order: 13000
headers:
  - key: X-User-Id
    value: '{{tony}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
