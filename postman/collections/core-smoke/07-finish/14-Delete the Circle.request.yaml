$kind: http-request
name: 'Delete the Circle'
method: DELETE
url: '{{base_url}}/api/v1/circles/{{circle_id}}'
order: 14000
headers:
  - key: X-User-Id
    value: '{{anish}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 204', () => pm.response.to.have.status(204));
